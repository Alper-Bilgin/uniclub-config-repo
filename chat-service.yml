server:
  port: 9012

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/uniclub_db

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: chat_schema

  # Redis (Online durumu ve Multi-instance pub/sub için)
  data:
    redis:
      host: localhost
      port: 6379

  # RabbitMQ (Gamification ve Notification için)
  rabbitmq:
    host: localhost
    port: 5672

# JWT Secret
jwt:
  secret: "bmljZS1zZWNyZXQtZm9yLXVuaWNsdWItY29ubmVjdC1wcm9qZWN0LXdpdGgtZW5vdWdoLWJ5dGVzLWZvci1oczUxMg=="
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 604800000
